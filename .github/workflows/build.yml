name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config dpkg fakeroot \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libpangocairo-1.0-0 libcups2
      - run: npm ci
      - run: npm test
      - name: Build packages
        shell: bash
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged native dependencies
        run: node scripts/check-packaged.js
      - name: Verify CRT controls on Windows
        if: runner.os == 'Windows'
        run: node scripts/check-gui-exit.js --crt
      - name: Verify legacy Windows simple-installer update
        if: runner.os == 'Windows'
        run: node scripts/check-windows-update.js
      - name: Verify NSIS recorded installation and update
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-nsis-update.ps1
      - name: Verify AppImage recorded installation and update
        if: runner.os == 'Linux'
        run: |
          directory="$(mktemp -d)"
          sh installer/install-unix.sh release/*.AppImage "$directory"
          sh installer/install-unix.sh release/*.AppImage "$directory"
          node -e 'const fs=require("fs"),p=require("path");const r=JSON.parse(fs.readFileSync(p.join(process.argv[1],".portal-console-install.json")));if(r.method!=="linux-appimage"||r.previousMethod!=="linux-appimage"||!r.previousVersion)process.exit(1)' "$directory"
          cp installer/install-unix.sh release/install-unix.sh
      - name: Verify macOS recorded installation and update
        if: runner.os == 'macOS'
        shell: bash
        run: |
          directory="$(mktemp -d)"
          ditto "release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/portal-console.app" "$directory/portal-console.app"
          sh installer/install-unix.sh release/portal-console-*-mac-${{ matrix.arch }}.dmg "$directory"
          sh installer/install-unix.sh release/portal-console-*-mac-${{ matrix.arch }}.zip "$directory"
          node -e 'const fs=require("fs"),p=require("path");const r=JSON.parse(fs.readFileSync(p.join(process.argv[1],"portal-console.app/.portal-console-install.json")));if(r.method!=="mac-zip"||r.previousMethod!=="mac-dmg"||!r.previousVersion)process.exit(1)' "$directory"
      - name: Verify packaged headless launcher
        if: runner.os == 'Linux'
        run: python3 scripts/check-headless.py
      - name: Bundle simple Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-installer.ps1 -ReleaseDirectory release
          Compress-Archive -LiteralPath release/installer -DestinationPath release/portal-console-simple-installer-win-x64.zip
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: portal-console-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.sh

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ubuntu-gui, deb-upgrade]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: portal-console-*
          merge-multiple: true
          path: packages
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber

  ubuntu-gui:
    name: Ubuntu 24.04 GUI and headless
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config xvfb \
            libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libpangocairo-1.0-0 libcups2
      - run: npm ci
      - run: npm run dist -- --linux --x64 --dir --publish never
      - run: node scripts/check-packaged.js
      - run: python3 scripts/check-headless.py
      - name: Configure sandbox permissions for unpacked GUI test
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - run: xvfb-run -a node scripts/check-linux-gui.js

  deb-upgrade:
    name: Upgrade Ubuntu deb from 0.1.0
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: portal-console-linux-x64
          path: packages
      - name: Download legacy release and test upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir legacy
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir legacy
          sudo apt-get update
          sudo apt-get install -y ./legacy/*.deb
          sudo apt-get install -y ./packages/*.deb
          python3 - <<'PY'
          import json
          with open('/opt/Portal Console/.portal-console-install.json') as f:
              record = json.load(f)
          assert record['method'] == 'linux-deb', record
          assert record['previousVersion'] == '0.1.0', record
          print(record)
          PY
          PORTAL_CONSOLE_EXECUTABLE=/usr/bin/portal-console python3 scripts/check-headless.py
